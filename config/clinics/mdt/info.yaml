    response: |
      **Magnetnoresonančna tomografija (MR)**

      Izvajamo MR preiskave vseh delov telesa:
      Glava, hrbtenica, koleno, rama, trebuh, dojke, prostata in drugo.

      🧲 Samoplačniško: od 200 € naprej
      ⏱️ Trajanje: 30–60 min (odvisno od preiskave)

      **Pred preiskavo** izpolnite MR vprašalnik (dobite ga na recepciji ali pri naročanju).

      ⚠️ Osebe s srčnim spodbujevalnikom ali defibrilatorjem MR preiskav ne morejo opraviti.

      Za naročilo kliknite **📅 Naroči se** ali pokličite **02 23 53 552**.

