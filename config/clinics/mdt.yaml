info_responses:
  pozdrav: |
    Pozdravljeni pri MDT&T – medicinski diagnostiki in terapiji!

    Sem vaš digitalni pomočnik. Pomagam vam z informacijami o preiskavah ter naročanjem na samoplačniške storitve.

    Kako vam lahko pomagam?
  kdo_si: |
    Sem digitalni pomočnik MDT&T d.o.o.

    Pomagam z informacijami o preiskavah (MR, RTG, UZ, ščitnica) in z naročanjem na samoplačniške storitve.
  kontakt: |
    MDT&T d.o.o. – Medicinska diagnostika in terapija
    Lavričeva ul. 1, 2000 Maribor

    📞 Radiološka ambulanta: 02 23 53 552 / 02 23 53 553
    ✉️ mr@mdt.si

    📞 Ambulanta za bolezni ščitnice: 02 23 53 555
    ✉️ scitnica@mdt.si

    🕐 Radiološka ambulanta: Pon–Pet 07:00–21:00
    🕐 Ambulanta za ščitnico: Pon–Tor 12:00–19:30 | Sre–Pet 07:00–15:00
  delovni_cas: "Radiološka ambulanta: pon–pet 07:00–21:00. Ambulanta za ščitnico: pon–tor 12:00–19:30, sre–pet 07:00–15:00."
  cenik: |
    Cenik vseh samoplačniških storitev najdete na naši spletni strani.

    Ultrazvočne preiskave izvajamo izključno samoplačniško.
    Za MR in RTG je možno naročanje na napotnico ali samoplačniško.

    Cenik: https://www.mdt.si/cenik/
  napotnica_info: |
    Naročanje na napotnico poteka izključno prek sistema eZdravje.

    Vrste napotnic:
    • Redna napotnica — čakalna doba 6 mesecev ali več
    • Hitra napotnica — krajša čakalna doba (zahteva klinično utemeljitev)
    • Zelo hitra napotnica — najkrajša čakalna doba (za urgentne primere)

    Napotnico pridobi vaš lečeči zdravnik in jo vnese v sistem eZdravje. Nato vas kontaktiramo sami.
  samoplacniski_info: |
    Samoplačniške storitve so na voljo brez čakalne dobe.

    Naročite se lahko:
    • Spletno naročanje: mdt.si/narocanje/
    • Po telefonu: 02 23 53 552
    • Po e-pošti: mr@mdt.si

    Ultrazvočne preiskave so izključno samoplačniške.
