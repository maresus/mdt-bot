mr_questionnaire:
  - id: "spodbujevalnik"
    question: "Ali imate vgrajen srčni spodbujevalnik ali defibrilator?"
    type: "yes_no"
    blocking: true
    block_message: "Žal pri osebah s srčnim spodbujevalnikom ali defibrilatorjem MR preiskav iz varnostnih razlogov ne opravljamo. Prosimo, posvetujte se z vašim zdravnikom glede alternativnih možnosti."
  - id: "alergija_ks"
    question: "Ste kdaj imeli alergijsko reakcijo na kontrastno sredstvo?"
    type: "yes_no"
    important: true
    note: "Prosimo, to omenite osebju ob prihodu."
  - id: "klavstrofobija"
    question: "Imate strah pred zaprtim prostorom (klavstrofobija)?"
    type: "yes_no"
    note: "Obvestite nas — pomagamo vam se ustrezno pripraviti."
  - id: "kovinski_vsadki"
    question: "Imate kovinske vsadke, endoprotezo, vijake ali drug vsajen material?"
    type: "yes_no"
    note: "Potrebovali boste certifikat o združljivosti z MR."
  - id: "nosecnost"
    question: "Ali ste noseči ali je nosečnost možna?"
    type: "yes_no"
    note: "Prosimo, obvestite nas pred preiskavo."

