unsupported_symptoms:
  - id: "glavobol"
    keywords:
      - "glava"
      - "glavobol"
      - "migrena"
      - "boli me glava"
    response:
      - |
        Razumem, glavobol je lahko zelo neprijeten.

        Za začetek lahko pomaga počitek, dovolj tekočine in manj obremenitve (ekrani, hrup, stres). Če se glavobol stopnjuje, traja več dni ali se pojavijo dodatni simptomi, je priporočljiv čimprejšnji pregled.

         To ni zdravniški nasvet ali diagnoza, ampak splošna usmeritev.

        V našem centru nimamo nevrologa. Lahko pa vam ponudim možnosti terminov pri specialistih, ki so pri nas na voljo.

        Želite, da vam pokažem možnosti?
      - |
        Razumem, da imate težave z glavobolom.

        Do pregleda lahko poskusite z mirovanjem, hidracijo in izogibanjem sprožilcem (npr. napor, premalo spanja, dolgotrajno delo za zaslonom).

         To ni zdravniški nasvet ali diagnoza, ampak splošna usmeritev.

        Ker pri nas nimamo nevrologa, vam lahko ponudim termine pri specialistih, ki so pri nas na voljo.

        Želite, da vam pokažem možnosti?
      - |
        Hvala za opis težave.

        Pri takih težavah je smiselno spremljati trajanje in jakost simptomov ter po potrebi čim prej opraviti pregled.

         To ni zdravniški nasvet ali diagnoza, ampak splošna usmeritev.

        Nevrologa pri nas žal nimamo, lahko pa vam pokažem razpoložljive možnosti pri specialistih, ki jih imamo.

        Želite, da vam pokažem možnosti?
    quick_replies:
      - label: "Da, predlagajte specialista"
        value: "DA"
      - label: "Ne, hvala"
        value: "NE"
  - id: "zobobol"
    keywords:
      - "zob"
      - "zobobol"
      - "skelenje"
      - "dlesen"
    response: "Žal mi je za težave z zobmi.  V našem centru nimamo zobozdravstvene ambulante, lahko pa ponudimo seznam nujnih zobozdravnikov v bližini ali termin pri splošnem zdravniku za protibolečinsko terapijo. Želite, da vas naročim na posvet?"
    ui_override:
      type: "quick_replies"
      data:
        - {label: "Da, prosim", value: "DA"}
        - {label: "Ne, hvala", value: "NE"}
info_responses:
  pozdrav: |
    Pozdravljeni! 

    Sem vaš digitalni pomočnik v zdravstvenem centru. Kako vam lahko pomagam?

    Lahko vam pomagam z informacijami o naših storitvah, delovnem času, ali pa vas naročim na pregled, če želite.
  kdo_si: |
    Sem digitalni pomočnik zdravstvenega centra.

    Z veseljem odgovorim na vprašanja o naših storitvah, cenah in razpoložljivih terminih.
  splosno: "Sem virtualni asistent Zdravstvenega centra. Pomagam pri naročanju in informacijah o storitvah."
  ekipa: |
    Naš zdravstveni center vodi strokovna ekipa zdravnikov in administracije.

    Za natančne informacije o vodstvu ali posameznih zdravnikih nas prosim kontaktirajte:
    -  01 234 56 78
    -  info@zdravstveni-center.si
  hvala: "Hvala za sporočilo! Če boste še kaj potrebovali, sem tukaj za vas. "
  pozdrav_variants:
    - "Živjo! Kako vam lahko danes pomagam?"
    - "Dober dan! Sem vaš digitalni asistent. Kako lahko pomagam?"
  storitve_variants:
    - "Nudimo dermatologa, ortopeda, okulista ter estetske/laserske posege in kozmetiko. Kaj vas zanima?"
    - "Najpogosteje: dermatolog, ortoped, okulist, laser, estetika, kozmetika. Povejte, kaj iščete."
  cene_variants:
    - "Cena je odvisna od storitve. Napišite, kateri pregled vas zanima, pa povem razpon."
    - "Za točen znesek potrebujem storitev (npr. dermatolog, ortoped, okulist). Katera vas zanima?"
  delovni_cas_variants:
    - "Delovni čas: pon–pet 8:00–18:00, sob 9:00–13:00 (nujni primeri), ned/prazniki zaprto."
  kontakt_variants:
    - "Naslov: Zdraviliška 12, Ljubljana. Tel: 01 234 56 78. Email: info@zdravstveni-center.si"
  hvala_variants:
    - "Hvala! Če boste še kaj potrebovali, sem tukaj."
