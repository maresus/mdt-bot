<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zdravstveni center – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1a3a5c;
      --navy-light: #234e7a;
      --accent: #2e86ab;
      --bg: #f0f4f8;
      --card: #ffffff;
      --border: #dce3ea;
      --muted: #6b7a8d;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #1a2530;
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .logo {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .brand h1 { font-size: 1.1rem; font-weight: 700; }
    .brand p { font-size: 0.78rem; opacity: 0.7; margin-top: 2px; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .stat-pill {
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .refresh-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .refresh-btn:hover { filter: brightness(1.1); }

    .page { max-width: 900px; margin: 0 auto; padding: 28px 16px; }

    .summary-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .summary-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 20px;
      flex: 1;
      min-width: 130px;
    }
    .summary-card .val { font-size: 1.9rem; font-weight: 700; color: var(--navy); }
    .summary-card .lbl { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .conv-list { display: grid; gap: 10px; }

    .conv-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .conv-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .conv-header:hover { background: #f7fafd; }
    .session-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .conv-meta { flex: 1; min-width: 0; }
    .conv-session {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-preview {
      font-size: 0.88rem;
      color: #1a2530;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .conv-time {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .msg-count {
      background: #e8f0fe;
      color: var(--navy);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .chevron {
      font-size: 0.85rem;
      color: var(--muted);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .chevron.open { transform: rotate(90deg); }

    .conv-body {
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      display: none;
      background: #fafcff;
    }
    .conv-body.open { display: block; }

    .message-pair { margin-bottom: 14px; }
    .message-pair:last-child { margin-bottom: 0; }
    .msg-row {
      display: flex;
      gap: 8px;
      margin-bottom: 5px;
    }
    .msg-role {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-top: 3px;
      width: 38px;
      flex-shrink: 0;
    }
    .msg-role.user { color: var(--navy); }
    .msg-role.bot { color: #2e7d52; }
    .msg-bubble {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-bubble.bot { background: #f0faf4; border-color: #c3e6d1; }
    .msg-ts {
      font-size: 0.7rem;
      color: var(--muted);
      padding-left: 46px;
      margin-bottom: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .intent-badge {
      background: #fef3c7;
      color: #92400e;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 0.68rem;
      font-weight: 600;
      margin-left: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🏥</div>
  <div class="brand">
    <h1>Zdravstveni center</h1>
    <p>Admin – Pogovori</p>
  </div>
  <div class="header-right">
    <div class="stat-pill" id="totalPill">— pogovorov</div>
    <button class="refresh-btn" onclick="loadConversations()">↻ Osveži</button>
  </div>
</header>

<div class="page">
  <div class="summary-bar">
    <div class="summary-card">
      <div class="val" id="statSessions">—</div>
      <div class="lbl">Sej skupaj</div>
    </div>
    <div class="summary-card">
      <div class="val" id="statMessages">—</div>
      <div class="lbl">Sporočil skupaj</div>
    </div>
    <div class="summary-card">
      <div class="val" id="statToday">—</div>
      <div class="lbl">Danes</div>
    </div>
  </div>

  <div class="section-title">Zadnji pogovori</div>
  <div class="conv-list" id="convList">
    <div class="loading">Nalagam pogovore…</div>
  </div>
</div>

<script>
  function formatTime(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const time = d.toLocaleTimeString('sl-SI', { hour: '2-digit', minute: '2-digit' });
      if (isToday) return 'Danes ' + time;
      const date = d.toLocaleDateString('sl-SI', { day: '2-digit', month: '2-digit' });
      return date + ' ' + time;
    } catch(e) { return iso; }
  }

  function isToday(iso) {
    if (!iso) return false;
    try {
      return new Date(iso).toDateString() === new Date().toDateString();
    } catch(e) { return false; }
  }

  function shortSession(sid) {
    if (!sid) return 'neznana seja';
    return sid.length > 16 ? sid.slice(0, 8) + '…' + sid.slice(-6) : sid;
  }

  function escape(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadConversations() {
    const list = document.getElementById('convList');
    list.innerHTML = '<div class="loading">Nalagam pogovore…</div>';

    let data;
    try {
      const res = await fetch('/api/admin/conversations?limit=200');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
    } catch(e) {
      list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Napaka pri nalaganju: ' + e.message + '</p></div>';
      return;
    }

    const convs = data.conversations || [];
    document.getElementById('totalPill').textContent = convs.length + ' pogovorov';
    document.getElementById('statMessages').textContent = convs.length;

    // Group by session_id
    const sessions = {};
    const sessionOrder = [];
    for (const c of convs) {
      const sid = c.session_id || 'unknown';
      if (!sessions[sid]) {
        sessions[sid] = [];
        sessionOrder.push(sid);
      }
      sessions[sid].push(c);
    }

    // Sort messages within each session by created_at
    for (const sid of sessionOrder) {
      sessions[sid].sort((a, b) => (a.created_at || '') < (b.created_at || '') ? -1 : 1);
    }

    document.getElementById('statSessions').textContent = sessionOrder.length;
    const todayCount = sessionOrder.filter(sid => {
      const msgs = sessions[sid];
      return msgs.some(m => isToday(m.created_at));
    }).length;
    document.getElementById('statToday').textContent = todayCount;

    if (sessionOrder.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>Ni pogovorov za prikaz.</p></div>';
      return;
    }

    list.innerHTML = '';
    sessionOrder.forEach((sid, idx) => {
      const msgs = sessions[sid];
      const first = msgs[0];
      const last = msgs[msgs.length - 1];
      const preview = first.user_message ? first.user_message.slice(0, 90) : '—';
      const cardId = 'conv-' + idx;

      const card = document.createElement('div');
      card.className = 'conv-card';

      const intents = [...new Set(msgs.map(m => m.intent).filter(Boolean))];
      const intentBadges = intents.slice(0, 2).map(i => `<span class="intent-badge">${escape(i)}</span>`).join('');

      card.innerHTML = `
        <div class="conv-header" onclick="toggleConv('${cardId}', this)">
          <div class="session-dot"></div>
          <div class="conv-meta">
            <div class="conv-session">${escape(shortSession(sid))}${intentBadges}</div>
            <div class="conv-preview">${escape(preview)}</div>
          </div>
          <div class="conv-right">
            <div class="conv-time">${formatTime(last.created_at)}</div>
            <div class="msg-count">${msgs.length} sporočil</div>
          </div>
          <div class="chevron" id="chev-${cardId}">›</div>
        </div>
        <div class="conv-body" id="${cardId}">
          ${msgs.map(m => `
            <div class="message-pair">
              <div class="msg-row">
                <div class="msg-role user">Usr</div>
                <div class="msg-bubble">${escape(m.user_message || '')}</div>
              </div>
              <div class="msg-row">
                <div class="msg-role bot">Bot</div>
                <div class="msg-bubble bot">${escape(m.bot_response || '')}</div>
              </div>
              <div class="msg-ts">${formatTime(m.created_at)}</div>
            </div>
          `).join('')}
        </div>
      `;
      list.appendChild(card);
    });
  }

  function toggleConv(id, header) {
    const body = document.getElementById(id);
    const chev = document.getElementById('chev-' + id);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    chev.classList.toggle('open', !isOpen);
  }

  loadConversations();
</script>
</body>
</html>
