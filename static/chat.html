<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Zdravstveni center – Asistent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #0891b2;
      --primary-dark: #0e7490;
      --primary-light: #06b6d4;
      --secondary: #059669;
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0fdfa 50%, #fef3c7 100%);
      --text: #0f172a;
      --text-muted: #64748b;
      --bg-card: #ffffff;
      --shadow: 0 20px 60px rgba(8, 145, 178, 0.15);
      --shadow-hover: 0 25px 70px rgba(8, 145, 178, 0.2);
      --border: #e2e8f0;
      --user-msg: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
      --bot-msg: #f8fafc;
      --radius: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      --app-vh: 100vh;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .chat-card {
      background: var(--bg-card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 800px;
      transition: box-shadow 0.3s ease;
    }

    .chat-card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .header-info h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-info p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .new-session-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }

    .new-session-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    /* Messages Area */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: linear-gradient(to bottom, #fafbfc 0%, #ffffff 100%);
    }

    .messages-container::-webkit-scrollbar {
      width: 8px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .messages-container::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Message Bubbles */
    .message {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: messageSlide 0.3s ease;
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .message.bot .message-avatar {
      background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
      color: white;
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
      color: white;
    }

    .message-bubble {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .message.bot .message-bubble {
      background: var(--bot-msg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.user .message-bubble {
      background: var(--user-msg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: center;
    }

    .ui-actions {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ui-actions .ui-btn {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      color: #0f172a;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ui-actions .ui-btn:hover {
      background: #bae6fd;
      transform: translateY(-1px);
    }

    .ui-date {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .ui-date input[type="date"] {
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .ui-label {
      width: 100%;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: var(--bot-msg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      max-width: fit-content;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }

    /* Input Area */
    .input-area {
      padding: 20px 24px;
      background: white;
      border-top: 1px solid var(--border);
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .quick-chip {
      padding: 8px 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
      font-weight: 500;
    }

    .quick-chip:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(8, 145, 178, 0.2);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 56px;
      max-height: 200px;
      transition: all 0.2s;
      outline: none;
    }

    .input-field:focus {
      background: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
    }

    .send-button {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 16px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(8, 145, 178, 0.25);
    }

    .send-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(8, 145, 178, 0.3);
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .input-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        align-items: stretch;
        justify-content: flex-start;
        overflow: hidden;
      }

      .container {
        padding: 0;
        min-height: var(--app-vh);
      }

      .chat-card {
        border-radius: 0;
        height: var(--app-vh);
        max-height: var(--app-vh);
        overflow: hidden;
      }

      .chat-header {
        padding: calc(8px + env(safe-area-inset-top)) 14px 10px;
        align-items: flex-start;
        position: sticky;
        top: 0;
        z-index: 30;
      }

      .header-icon {
        width: 38px;
        height: 38px;
        font-size: 19px;
        border-radius: 10px;
      }

      .header-info h1 {
        font-size: 1.02rem;
        line-height: 1.15;
      }

      .header-info p {
        font-size: 0.74rem;
        line-height: 1.25;
      }

      .new-session-btn {
        padding: 6px 10px;
        font-size: 0.75rem;
      }

      .status-badge {
        padding: 5px 9px;
        font-size: 0.72rem;
      }

      .messages-container {
        padding: 12px;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: 210px;
      }

      .message-bubble {
        max-width: 85%;
      }

      .input-area {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.08);
        border-top: 1px solid var(--border);
      }

      .quick-actions {
        display: none !important;
      }

      .quick-chip {
        font-size: 0.8rem;
        padding: 6px 12px;
        white-space: nowrap;
      }

      .input-wrapper {
        gap: 8px;
      }

      .input-field {
        min-height: 44px;
        max-height: 96px;
        padding: 10px 12px;
      }

      .send-button {
        padding: 12px 14px;
        font-size: 0.88rem;
      }

      .input-hint {
        font-size: 0.72rem;
        margin-top: 6px;
        display: none;
      }
    }

    /* Welcome Message Styling */
    .welcome-message {
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdfa 100%);
      border: 2px solid #bae6fd;
      border-radius: var(--radius);
      padding: 20px;
      margin: 20px 0;
    }

    .welcome-message h3 {
      color: var(--primary);
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .welcome-message ul {
      list-style: none;
      margin-left: 0;
      padding-left: 0;
    }

    .welcome-message li {
      padding: 8px 0;
      color: var(--text);
      font-size: 0.95rem;
    }

    .welcome-message li:before {
      content: " ";
      color: var(--secondary);
      font-weight: bold;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="chat-card">
      <!-- Header -->
      <div class="chat-header">
        <div class="header-left">
          <div class="header-icon"></div>
          <div class="header-info">
            <h1>Zdravstveni center</h1>
            <p>Asistent za naročanje pregledov</p>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <button class="new-session-btn" id="newSessionBtn"> Nova seja</button>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>Na voljo</span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-container" id="messagesContainer">
        <!-- Messages will be added here -->
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="quick-actions">
          <div class="quick-chip" data-prompt="Kako poteka naročanje na pregled?"> Naročanje</div>
          <div class="quick-chip" data-prompt="Katere preglede in posege izvajate?"> Pregledi</div>
          <div class="quick-chip" data-prompt="Imate cenik storitev?"> Cenik</div>
          <div class="quick-chip" data-prompt="Kje se nahajate in kako do vas?"> Lokacija</div>
          <div class="quick-chip" data-prompt="Rad bi naročil termin za dermatološki pregled."> Naroči termin</div>
        </div>
        <div class="input-wrapper">
          <textarea
            class="input-field"
            id="messageInput"
            placeholder="Vnesite sporočilo..."></textarea>
          <button class="send-button" id="sendButton">
            <span>Pošlji</span>
            <span>→</span>
          </button>
        </div>
        <div class="input-hint">Enter = pošlji • Shift+Enter = nova vrstica</div>
      </div>
    </div>
  </div>

  <script>
    function setAppVh() {
      const vh = (window.visualViewport && window.visualViewport.height)
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-vh', `${Math.round(vh)}px`);
    }
    setAppVh();
    window.addEventListener('resize', setAppVh);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppVh);
    }

    // Configuration
    const apiUrl = "/chat/";
    const sessionKey = "chat_session_id";

    // Session Management
    let sessionId = localStorage.getItem(sessionKey);
    if (!sessionId) {
      sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      localStorage.setItem(sessionKey, sessionId);
    }

    // DOM Elements
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const newSessionBtn = document.getElementById('newSessionBtn');

    messageInput.addEventListener('focus', () => {
      setTimeout(() => {
        messageInput.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }, 120);
    });

    // Timeout Management (1 hour)
    const ONE_HOUR = 3600 * 1000;

    function checkChatTimeout() {
      const lastActivity = localStorage.getItem("last_chat_activity");
      const now = Date.now();
      if (lastActivity && now - Number(lastActivity) > ONE_HOUR) {
        localStorage.removeItem("chat_history");
        localStorage.removeItem(sessionKey);
        localStorage.removeItem("last_chat_activity");
        sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
        localStorage.setItem(sessionKey, sessionId);
      }
    }
    checkChatTimeout();

    // Format message text (basic markdown support)
    function formatMessage(text) {
      // Convert newlines to <br>
      text = text.replace(/\n/g, '<br>');
      // Bold **text**
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Italic *text*
      text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
      return text;
    }

    // Add message to chat
    function addMessage(text, type = 'bot', metadata = null) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = type === 'bot' ? '' : '';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = formatMessage(text);

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);

      messagesContainer.appendChild(messageDiv);
      // Scroll to user message so it stays at top - user scrolls down to read response
      if (type === 'user') {
        messageDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      localStorage.setItem("last_chat_activity", Date.now().toString());

      if (type === 'bot' && metadata?.ui) {
        renderUiActions(bubble, metadata.ui);
      }
    }

    // Show typing indicator
    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = '';

      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = `
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;

      typingDiv.appendChild(avatar);
      typingDiv.appendChild(indicator);
      messagesContainer.appendChild(typingDiv);
      // Don't scroll - user message stays visible at top
    }

    // Hide typing indicator
    function hideTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) {
        indicator.remove();
      }
    }

    // Send message
    function normalizeChatResponse(data) {
      const displayText = data?.display_text ?? data?.text ?? data?.reply ?? '';
      const metadata = data?.metadata ?? {};
      const actionSuggestion = data?.action_suggestion ?? metadata?.action_suggestion ?? null;

      let finalText = displayText || 'Ni odgovora.';
      if (actionSuggestion) {
        finalText += `\n\n ${actionSuggestion}`;
      }

      return { text: finalText, metadata };
    }

    function formatDateToDotted(isoDate) {
      const [year, month, day] = isoDate.split('-');
      return `${day}.${month}.${year}`;
    }

    function renderUiActions(bubbleEl, ui) {
      const actions = document.createElement('div');
      actions.className = 'ui-actions';

      if (ui?.label) {
        const label = document.createElement('div');
        label.className = 'ui-label';
        label.textContent = ui.label;
        actions.appendChild(label);
      }

      if (ui?.type === 'date_picker') {
        const wrap = document.createElement('div');
        wrap.className = 'ui-date';

        const input = document.createElement('input');
        input.type = 'date';
        if (ui.min_date) input.min = ui.min_date;

        const btn = document.createElement('button');
        btn.className = 'ui-btn';
        btn.textContent = 'Potrdi datum';
        btn.addEventListener('click', () => {
          if (!input.value) return;
          const formatted = formatDateToDotted(input.value);
          sendMessageWithText(formatted);
        });

        wrap.appendChild(input);
        wrap.appendChild(btn);
        actions.appendChild(wrap);
      } else if (ui?.type === 'time_slots' && Array.isArray(ui.slots)) {
        ui.slots.forEach(slot => {
          const btn = document.createElement('button');
          btn.className = 'ui-btn';
          btn.textContent = slot;
          btn.addEventListener('click', () => sendMessageWithText(slot));
          actions.appendChild(btn);
        });
      } else if (ui?.type === 'confirm' && Array.isArray(ui.options)) {
        ui.options.forEach(option => {
          const btn = document.createElement('button');
          btn.className = 'ui-btn';
          btn.textContent = option;
          btn.addEventListener('click', () => sendMessageWithText(option));
          actions.appendChild(btn);
        });
      } else if (ui?.type === 'service_select' && Array.isArray(ui.options)) {
        ui.options.forEach(option => {
          const btn = document.createElement('button');
          btn.className = 'ui-btn';
          btn.textContent = option.label || option.value;
          btn.addEventListener('click', () => sendMessageWithText(option.value || option.label));
          actions.appendChild(btn);
        });
      }

      if (actions.children.length > 0) {
        bubbleEl.appendChild(actions);
      }
    }

    async function sendMessageWithText(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      addMessage(trimmed, 'user');
      messageInput.value = '';
      messageInput.focus();

      sendButton.disabled = true;
      showTypingIndicator();

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: trimmed,
            session_id: sessionId
          })
        });

        hideTypingIndicator();

        if (!response.ok) {
          addMessage('Oprostite, prišlo je do napake pri povezavi. Poskusite znova.', 'bot');
        } else {
          const data = await response.json();
          const normalized = normalizeChatResponse(data);
          addMessage(normalized.text, 'bot', normalized.metadata);
        }
      } catch (error) {
        console.error('Error:', error);
        hideTypingIndicator();
        addMessage('Prišlo je do napake pri povezavi s strežnikom. Preverite internetno povezavo.', 'bot');
      } finally {
        sendButton.disabled = false;
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      sendMessageWithText(text);
    }

    // Show welcome message
    function showWelcome() {
      messagesContainer.innerHTML = '';
      addMessage('Pozdravljeni! Kako vam lahko pomagam?', 'bot');
    }

    // Event Listeners
    sendButton.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Quick action chips
    document.querySelectorAll('.quick-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const prompt = chip.getAttribute('data-prompt');
        messageInput.value = prompt;
        messageInput.focus();
      });
    });

    // New session button
    newSessionBtn.addEventListener('click', () => {
      localStorage.removeItem(sessionKey);
      sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      localStorage.setItem(sessionKey, sessionId);
      localStorage.setItem("last_chat_activity", Date.now().toString());
      showWelcome();
    });

    // Initialize
    showWelcome();
  </script>
</body>
</html>
