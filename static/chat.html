<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>MDT&T – Digitalni pomočnik</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #438bd1;
      --primary-dark: #2f6fad;
      --primary-light: #e8f2fb;
      --primary-lighter: #f0f7ff;
      --text: #1a2638;
      --muted: #5a7a9a;
      --border: #cde0f2;
      --bot-bg: #e8f2fb;
      --white: #ffffff;
      --success: #16a34a;
      --danger: #dc2626;
    }
    html, body {
      height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--primary-lighter);
      color: var(--text); overflow: hidden;
    }
    .container { display: flex; flex-direction: column; height: 100%; max-width: 860px; margin: 0 auto; background: var(--white); box-shadow: 0 0 40px rgba(67,139,209,0.12); }

    /* HEADER */
    .header { padding: 14px 20px; background: var(--primary); color: #fff; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .header-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; color: #fff; line-height: 1; }
    .header-logo span { font-weight: 400; opacity: 0.85; }
    .header-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.3); }
    .header-text h1 { font-size: 0.92rem; font-weight: 600; opacity: 0.95; }
    .header-text p { font-size: 0.72rem; opacity: 0.75; margin-top: 1px; }
    .header-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 0.72rem; opacity: 0.85; }
    .status-dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; }
    .header-new-session { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; margin-left: 10px; }
    .header-new-session:hover { background: rgba(255,255,255,0.28); }

    /* MESSAGES */
    .messages { flex: 1; overflow-y: auto; padding: 20px 16px; background: var(--white); display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { margin-left: auto; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { margin-right: auto; background: var(--bot-bg); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg.typing { background: var(--bot-bg); border: 1px solid var(--border); padding: 14px 18px; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; opacity: 0.6; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    .ui-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .ui-btn { background: var(--white); border: 1.5px solid var(--primary); color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .ui-btn:hover { background: var(--primary); color: #fff; }

    /* QUICK BUTTONS */
    .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 8px; background: var(--primary-lighter); border-top: 1px solid var(--border); flex-shrink: 0; }
    .quick-btn { padding: 7px 14px; border-radius: 20px; background: var(--white); border: 1.5px solid var(--border); color: var(--muted); font-size: 0.78rem; cursor: pointer; transition: all 0.15s; }
    .quick-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    /* NAROČI SE */
    .narocise-bar { padding: 10px 16px; background: var(--primary-lighter); border-top: 1px solid var(--border); flex-shrink: 0; }
    .narocise-btn { width: 100%; padding: 13px 20px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    .narocise-btn:hover { background: var(--primary-dark); color: #fff; }

    /* BOOKING OVERLAY */
    .booking-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(20,40,70,0.45); display: none; align-items: flex-end; justify-content: center; }
    .booking-overlay.open { display: flex; }
    .booking-sheet { background: var(--white); border-radius: 24px 24px 0 0; width: 100%; max-width: 860px; max-height: 88vh; overflow-y: auto; animation: slide-up 0.25s cubic-bezier(.32,.72,0,1); }
    @keyframes slide-up { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sheet-topbar { position: sticky; top: 0; z-index: 10; background: var(--primary); padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-radius: 24px 24px 0 0; }
    .sheet-back { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .sheet-back:hover { background: rgba(255,255,255,0.3); }
    .sheet-title { color: #fff; font-size: 1rem; font-weight: 700; }
    .sheet-body { padding: 20px 20px 32px; }
    .bf-field { margin-bottom: 14px; }
    .bf-field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .bf-field input, .bf-field select, .bf-field textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.9rem; outline: none; background: var(--primary-lighter); transition: border-color 0.15s; color: var(--text); }
    .bf-field input:focus, .bf-field select:focus, .bf-field textarea:focus { border-color: var(--primary); background: var(--white); }
    .bf-field textarea { min-height: 70px; resize: none; }
    .bf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bf-submit { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 6px; transition: background 0.15s; }
    .bf-submit:hover { background: var(--primary-dark); }
    .bf-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .bf-success { text-align: center; padding: 32px 16px; }
    .bf-success .s-icon { font-size: 3rem; margin-bottom: 12px; }
    .bf-success h3 { font-size: 1.1rem; font-weight: 700; color: var(--success); margin-bottom: 8px; }
    .bf-success p { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }

    /* INPUT */
    .input-area { padding: 12px 16px; background: var(--white); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    .input-area textarea { flex: 1; min-height: 44px; max-height: 110px; padding: 11px 15px; border: 1.5px solid var(--border); border-radius: 22px; font-family: inherit; font-size: 0.9rem; resize: none; outline: none; line-height: 1.4; background: var(--primary-lighter); }
    .input-area textarea:focus { border-color: var(--primary); background: var(--white); }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--primary); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0; }
    .send-btn:hover { background: var(--primary-dark); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .powered { padding: 6px; text-align: center; font-size: 0.65rem; color: #bbb; background: var(--white); }

  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-logo">MDT<span>&amp;T</span></div>
    <div class="header-divider"></div>
    <div class="header-text">
      <h1>Digitalni pomočnik</h1>
      <p>Medicinska diagnostika in terapija · Maribor</p>
    </div>
    <div class="header-status"><div class="status-dot"></div>Na voljo</div>
    <button class="header-new-session" id="newSessionBtn">Nova seja</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-btns" id="quickBtns">
    <button class="quick-btn" data-msg="Kako se naročim na MR preiskavo?">Naročanje MR</button>
    <button class="quick-btn" data-msg="Katere preiskave so samoplačniške?">Samoplačniške storitve</button>
    <button class="quick-btn" data-msg="Kakšna je razlika med napotnico in samoplačniškim?">Napotnica ali samoplačniško?</button>
    <button class="quick-btn" data-msg="Kje se nahajate in kakšen je delovni čas?">Kontakt in lokacija</button>
    <button class="quick-btn" data-msg="Kako se pripravim na MR preiskavo?">Priprava na MR</button>
    <button class="quick-btn" data-msg="Imate cenik storitev?">Cenik</button>
  </div>

  <div class="narocise-bar">
    <button class="narocise-btn" id="narociseBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      Naroči se na preiskavo
    </button>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="Vprašajte o preiskavah, naročanju, pripravi…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" aria-label="Pošlji">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="powered">MDT&amp;T d.o.o. · Lavričeva ul. 1, Maribor · 02 23 53 552</div>
</div>

<!-- BOOKING OVERLAY -->
<div class="booking-overlay" id="bookingOverlay">
  <div class="booking-sheet">
    <div class="sheet-topbar">
      <button class="sheet-back" id="closeSheet">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Nazaj
      </button>
      <span class="sheet-title">Naroči se na preiskavo</span>
    </div>
    <div class="sheet-body">
      <div id="bfForm">
        <div class="bf-field">
          <label>Vrsta preiskave *</label>
          <select id="bf-service">
            <option value="">— Izberite preiskavo —</option>
            <optgroup label="MR — Magnetnoresonančna tomografija">
              <option>MR glave in vratu</option>
              <option>MR hrbtenice</option>
              <option>MR sklepov in okončin</option>
              <option>MR trebuha</option>
              <option>MR dojk</option>
              <option>MR prostate</option>
              <option>MR — drugo</option>
            </optgroup>
            <optgroup label="RTG — Rentgensko slikanje">
              <option>RTG slikanje</option>
            </optgroup>
            <optgroup label="UZ — Ultrazvočna diagnostika">
              <option>UZ diagnostika</option>
              <option>UZ vodeni poseg</option>
            </optgroup>
            <optgroup label="Ambulanta za bolezni ščitnice">
              <option>Pregled ščitnice</option>
            </optgroup>
          </select>
        </div>
        <div class="bf-row">
          <div class="bf-field">
            <label>Ime in priimek *</label>
            <input type="text" id="bf-name" placeholder="Ana Novak">
          </div>
          <div class="bf-field">
            <label>Telefon *</label>
            <input type="tel" id="bf-phone" placeholder="041 123 456">
          </div>
        </div>
        <div class="bf-field">
          <label>E-pošta</label>
          <input type="email" id="bf-email" placeholder="ana@email.com">
        </div>
        <div class="bf-field">
          <label>Željeni datum</label>
          <input type="date" id="bf-date">
        </div>
        <div class="bf-field">
          <label>Opomba</label>
          <textarea id="bf-note" placeholder="Dodatne informacije, posebne zahteve…"></textarea>
        </div>
        <button class="bf-submit" id="bf-submitBtn" onclick="submitBooking()">Pošlji naročilo →</button>
      </div>
      <div class="bf-success" id="bfSuccess" style="display:none">
        <div class="s-icon">✅</div>
        <h3>Naročilo prejeto!</h3>
        <p>Ekipa MDT&amp;T vas bo kontaktirala za potrditev termina.</p>
        <p style="margin-top:12px;font-size:0.78rem;color:var(--muted);">Vprašanja? <strong>02 23 53 552</strong></p>
      </div>
    </div>
  </div>
</div>


<script>
  const STORAGE_KEY = 'mdt_chat_history';
  const SESSION_KEY = 'mdt_session_id';
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const quickBtns = document.getElementById('quickBtns');

  let sessionId = localStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  // Booking overlay
  const bookingOverlay = document.getElementById('bookingOverlay');
  document.getElementById('narociseBtn').addEventListener('click', () => {
    bookingOverlay.classList.add('open');
    document.getElementById('bf-date').min = new Date().toISOString().split('T')[0];
  });
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  bookingOverlay.addEventListener('click', e => { if (e.target === bookingOverlay) closeSheet(); });

  function closeSheet() {
    bookingOverlay.classList.remove('open');
    document.getElementById('bfForm').style.display = 'block';
    document.getElementById('bfSuccess').style.display = 'none';
    document.getElementById('bf-submitBtn').disabled = false;
    document.getElementById('bf-submitBtn').textContent = 'Pošlji naročilo →';
    ['bf-service','bf-name','bf-phone','bf-email','bf-date','bf-note'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
  }

  async function submitBooking() {
    const service = document.getElementById('bf-service').value;
    const name = document.getElementById('bf-name').value.trim();
    const phone = document.getElementById('bf-phone').value.trim();
    const email = document.getElementById('bf-email').value.trim();
    const date = document.getElementById('bf-date').value;
    const note = document.getElementById('bf-note').value.trim();
    if (!service || !name || !phone) { alert('Prosimo izpolnite vsaj: storitev, ime in telefon.'); return; }
    const btn = document.getElementById('bf-submitBtn');
    btn.disabled = true; btn.textContent = 'Pošiljam…';
    try {
      await fetch('/', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: '', session_id: sessionId, booking_form: { service, name, phone, email, date, note } }) });
    } catch(e) { console.error(e); }
    document.getElementById('bfForm').style.display = 'none';
    document.getElementById('bfSuccess').style.display = 'block';
    addMessageToDOM(`Naročilo: ${service} · ${name} · ${phone}`, 'user');
    addMessageToDOM('Hvala za naročilo! Kontaktirali vas bomo za potrditev termina.', 'bot');
    setTimeout(closeSheet, 3500);
  }

  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function escapeHtml(text) {
    const d = document.createElement('div'); d.textContent = text;
    return d.innerHTML.replace(/\n/g, '<br>');
  }

  function renderMarkdown(text) {
    var escaped = (function(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; })(text);
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#0f4fa8;text-decoration:underline;">$1</a>');
    escaped = escaped.replace(/(?<!=["'])(https?:\/\/[^\s<>"')\]]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#0f4fa8;text-decoration:underline;">$1</a>');
    escaped = escaped.replace(/((?:^|\n)- [^\n]+)+/g, function(block) {
      var items = block.trim().split(/\n/).map(function(line) { return '<li>' + line.replace(/^- /, '') + '</li>'; }).join('');
      return '<ul style="margin:6px 0 6px 16px;padding:0;">' + items + '</ul>';
    });
    escaped = escaped.replace(/\n\n+/g, '</p><p style="margin:6px 0;">');
    escaped = escaped.replace(/\n/g, '<br>');
    return '<p style="margin:0;">' + escaped + '</p>';
  }

  function addMessageToDOM(text, who, save = true, metadata = null) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = who === 'bot' ? renderMarkdown(text) : escapeHtml(text);
    messagesEl.appendChild(div);
    scrollToBottom();
    if (who === 'bot' && metadata?.ui) renderUiActions(div, metadata.ui);
    if (save) saveHistory();
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing'; div.id = 'typing';
    div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div); scrollToBottom();
  }
  function hideTyping() { document.getElementById('typing')?.remove(); }

  function renderUiActions(container, ui) {
    const actions = document.createElement('div');
    actions.className = 'ui-actions';
    let items = null;
    if (ui.type === 'time_slots') items = (ui.slots || []).map(s => ({label:s, value:s}));
    else if (ui.type === 'confirm') items = (ui.options || []).map(o => ({label:o, value:o}));
    else if (ui.type === 'service_select') items = (ui.options || []).map(o => ({label:o.label||o.value, value:o.value||o.label}));
    if (items) items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'ui-btn'; btn.textContent = item.label;
      btn.addEventListener('click', () => sendMessage(item.value));
      actions.appendChild(btn);
    });
    if (actions.children.length) container.appendChild(actions);
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addMessageToDOM(text, 'user');
    inputEl.value = ''; inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    quickBtns.style.display = 'none';
    showTyping();
    try {
      const res = await fetch('/chat/', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: text, session_id: sessionId, clinic_id: 'mdt' })
      });
      hideTyping();
      if (res.ok) {
        const data = await res.json();
        const txt = data?.display_text ?? data?.text ?? data?.reply ?? 'Oprostite, prišlo je do napake.';
        const action = data?.action_suggestion ?? data?.metadata?.action_suggestion;
        addMessageToDOM(action ? `${txt}\n\n💡 ${action}` : txt, 'bot', true, data?.metadata ?? null);
      } else {
        addMessageToDOM('Oprostite, strežnik trenutno ni dosegljiv. Pokličite nas: 02 23 53 552', 'bot');
      }
    } catch(e) {
      hideTyping();
      addMessageToDOM('Oprostite, prišlo je do napake pri povezavi.', 'bot');
    }
    sendBtn.disabled = false;
    inputEl.focus();
  }

  function saveHistory() {
    try {
      const msgs = [...document.querySelectorAll('.msg:not(.typing)')].map(el => ({text: el.textContent, who: el.classList.contains('user') ? 'user' : 'bot'}));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-60)));
    } catch(e) {}
  }

  function loadHistory() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const msgs = JSON.parse(saved);
        if (msgs.length > 0) { msgs.forEach(m => addMessageToDOM(m.text, m.who, false)); quickBtns.style.display = 'none'; return true; }
      }
    } catch(e) {}
    return false;
  }

  document.getElementById('newSessionBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(SESSION_KEY);
    sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
    localStorage.setItem(SESSION_KEY, sessionId);
    messagesEl.innerHTML = ''; quickBtns.style.display = 'flex';
    addMessageToDOM('Pozdravljeni pri MDT&T!\n\nSem vaš digitalni pomočnik. Pomagam vam z informacijami o preiskavah ter naročanjem na samoplačniške storitve.\n\nKako vam lahko pomagam?', 'bot', false);
  });

  sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(inputEl.value); } });
  inputEl.addEventListener('input', () => { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px'; });
  document.querySelectorAll('.quick-btn').forEach(btn => btn.addEventListener('click', () => sendMessage(btn.dataset.msg)));

  if (!loadHistory()) {
    addMessageToDOM('Pozdravljeni pri MDT&T!\n\nSem vaš digitalni pomočnik. Pomagam vam z informacijami o preiskavah ter naročanjem na samoplačniške storitve.\n\nKako vam lahko pomagam?', 'bot', false);
  }
</script>
</body>
</html>
